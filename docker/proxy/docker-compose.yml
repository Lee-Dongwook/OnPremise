version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: proxy-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - onprem-net

networks:
  onprem-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
