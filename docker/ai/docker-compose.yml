version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - onprem-net
    # Host에 NVIDIA GPU가 있는 경우 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-open-webui
    restart: always
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ai-ollama:11434
    volumes:
      - webuidata:/app/backend/data
    networks:
      - onprem-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - onprem-net

networks:
  onprem-net:
    external: true

volumes:
  ollamadata:
  webuidata:
  qdrantdata:
